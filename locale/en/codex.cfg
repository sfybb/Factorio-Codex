[mod-setting-description]
fcodex_indexing_speed=How many translations should be indexed per tick (Higher is faster).\nThis setting speeds up the indexing step but the speed of the translations step will be unchanged.\n[font=default-semibold]Note: higher values may cause lags while indexing is in progress.[/color] If you have lags while indexing try to reduce this number
fcodex_always_si_prefix=Should bigger numbers end in "k", "M", etc. even if no other unit is present.\nOn: 100k\nOff: 100000
fcodex_search_items=Should items be included in search results?
fcodex_search_items_color=Alpha value (transparency) is ignored
fcodex_search_fluids=Should fluids be included in search results?
fcodex_search_fluids_color=Alpha value (transparency) is ignored
fcodex_search_technologies=Should technologies be included in search results?
fcodex_search_technologies_color=Alpha value (transparency) is ignored
fcodex_search_technologies_always_last=When deciding on the search result order technologies always show after everything else