[mod-setting-description]
fcodex_indexing_speed=Wie viele Übersetzte Begriffe pro Tick indiziert werden sollen (Größer ist schneller).\nDiese Einstellung beschleunigt die Indizierungsgeschwindigkeit, jedoch bleibt die Übersetzungsgeschwindigkeit unverändert.\n[font=default-semibold]Hinweis: Höhere Werte können zu Lag während der Indizierung führen.[/color] Wenn es zu Lag kommt, versuche diese Zahl zu verringern
fcodex_always_si_prefix=Sollen größere Zahlen in "k" "M" etc. enden, selbst wenn keine Einheit vorhanden ist.\nAn: 100k\nAus: 100000
fcodex_search_items=Sollen Gegenstände in den Suchergebnissen enthalten sein?
fcodex_search_items_color=Alpha-Wert (Transparenz) wird ignoriert
fcodex_search_fluids=Sollen Flüssigkeiten in den Suchergebnissen enthalten sein?
fcodex_search_fluids_color=Alpha-Wert (Transparenz) wird ignoriert
fcodex_search_technologies=Sollen Technologien in den Suchergebnissen enthalten sein?
fcodex_search_technologies_color=Alpha-Wert (Transparenz) wird ignoriert
fcodex_search_technologies_always_last=Bei der Sortierung von Suchergebnissen werden Technologien immer hinten einsortiert